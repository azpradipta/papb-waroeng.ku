name: waroeng_ku
description: "Aplikasi kasir dan pengelolaan warung dengan Supabase."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.15.4
  pdf: ^3.11.3
  printing: ^5.14.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.4.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF7A29"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  licenses:
    - docs/licenses/FONT_NOTICES.txt
  assets:
    - assets/icon/icon.png
